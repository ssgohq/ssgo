name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.25"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  verify:
    name: Verify Release
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
        exclude:
          - os: ubuntu-latest
            arch: arm64
    steps:
      - name: Download and verify (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          curl -sL "https://github.com/ssgohq/ssgo/releases/download/v${VERSION}/ssgo_Linux_x86_64.tar.gz" | tar xz
          ./ssgo version

      - name: Download and verify (macOS amd64)
        if: runner.os == 'macOS' && matrix.arch == 'amd64'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          curl -sL "https://github.com/ssgohq/ssgo/releases/download/v${VERSION}/ssgo_Darwin_x86_64.tar.gz" | tar xz
          ./ssgo version

      - name: Download and verify (macOS arm64)
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          curl -sL "https://github.com/ssgohq/ssgo/releases/download/v${VERSION}/ssgo_Darwin_arm64.tar.gz" | tar xz
          ./ssgo version
